name: Release contracts

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      proof_mode:
        description: Release proof execution mode
        required: false
        default: surface
        type: choice
        options:
          - surface
          - bootstrap
      bundle_path:
        description: Absolute sealed bootstrap bundle path on the one-shot local relay
        required: false
        default: /private/tmp/ionify-release-authority-input-0.1.37
        type: string

permissions:
  contents: read

jobs:
  release-surface:
    if: github.event_name == 'pull_request' || inputs.proof_mode != 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run build
      - run: npm run verify:release
      - run: >-
          pnpm exec vitest run
          tests/native-distribution.test.ts
          tests/deps-runtime-url.test.ts
          tests/publish-all.test.ts
          tests/release-authority.test.ts
      - run: node -e "const p=require('./package.json');if(p.engines?.node!=='^22.0.0 || ^24.0.0')process.exit(1)"
      - run: node --check scripts/publish-all.mjs
      - run: node --check scripts/real-registry-smoke.mjs
      - run: node --check scripts/release-local-registry.mjs
      - run: node --check scripts/release-authority.mjs
      - run: node --check scripts/native-abi-proof.mjs
      - run: node --check scripts/prove-split-release-consumer.mjs
      - run: node --check scripts/verify-split-proof-input.mjs
      - run: node --check scripts/aggregate-split-release-proofs.mjs
      - run: node --check scripts/inject-split-proof-failures.mjs

  stage-sealed-input:
    if: github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'bootstrap'
    name: relay sealed public-safe bootstrap input
    runs-on: [self-hosted, macOS, ARM64, ionify-release-stager]
    timeout-minutes: 10
    steps:
      - name: Restrict the one-shot relay authority
        shell: bash
        env:
          BUNDLE_PATH: ${{ inputs.bundle_path }}
        run: |
          set -euo pipefail
          if [[ "${{ github.actor }}" != "khaledM-salem" ]]; then
            echo "Only the release owner may invoke the local artifact relay." >&2
            exit 1
          fi
          case "$BUNDLE_PATH" in
            /private/tmp/ionify-release-authority-input-*) ;;
            *) echo "Refusing bundle outside the dedicated release-authority prefix: $BUNDLE_PATH" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sealed input before it leaves the local boundary
        run: node scripts/verify-split-proof-input.mjs "${{ inputs.bundle_path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-authority-input-0.1.37
          path: ${{ inputs.bundle_path }}
          if-no-files-found: error
          retention-days: 7

  consumer-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'bootstrap'
    needs: stage-sealed-input
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      matrix_hash: ${{ steps.matrix.outputs.matrix_hash }}
      lane_count: ${{ steps.matrix.outputs.lane_count }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-authority.mjs matrix --output "$RUNNER_TEMP/matrix.json"
          echo "matrix=$(node -e "const p=require(process.argv[1]);process.stdout.write(JSON.stringify({include:p.lanes}))" "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
          echo "matrix_hash=$(node -e "const p=require(process.argv[1]);process.stdout.write(p.coverage.matrixHash)" "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"
          echo "lane_count=$(node -e "const p=require(process.argv[1]);process.stdout.write(String(p.coverage.laneCount))" "$RUNNER_TEMP/matrix.json")" >> "$GITHUB_OUTPUT"

  public-consumer:
    if: github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'bootstrap'
    name: ${{ matrix.laneId }}
    needs:
      - stage-sealed-input
      - consumer-matrix
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          path: public-candidate
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: matrix.muslContainer == null
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        if: matrix.muslContainer == null
        with:
          node-version: ${{ matrix.nodeMajor }}
      - name: Install Yarn Classic on direct-host consumers
        if: matrix.muslContainer == null
        run: npm install --global yarn@1.22.22
      - uses: actions/download-artifact@v4
        with:
          name: release-authority-input-0.1.37
          path: ${{ runner.temp }}/release-authority-input
      - name: Install the common Chromium revision for blocking browser lanes
        if: matrix.browser && matrix.muslContainer == null
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.60.0
          npx playwright install --with-deps chromium
      - name: Prove one derived direct-host consumer lane
        if: matrix.muslContainer == null
        shell: bash
        run: |
          browser_arg=""
          if [[ "${{ matrix.browser }}" == "true" ]]; then browser_arg="--browser"; fi
          node scripts/verify-split-proof-input.mjs "${{ runner.temp }}/release-authority-input"
          node scripts/prove-split-release-consumer.mjs \
            --input "${{ runner.temp }}/release-authority-input" \
            --public-candidate public-candidate \
            --package-target "${{ matrix.target }}" \
            --phase "${{ matrix.phase }}" \
            --node-major "${{ matrix.nodeMajor }}" \
            --package-manager "${{ matrix.packageManager }}" \
            --mode "${{ matrix.mode }}" \
            --output "${{ runner.temp }}/consumer-${{ matrix.laneId }}" \
            $browser_arg
      - name: Prove one derived target-native musl consumer lane
        if: matrix.muslContainer != null
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace "${{ matrix.muslContainer }}" sh -lc '
              set -eu
              apk add --no-cache git
              git config --global --add safe.directory /workspace
              git config --global --add safe.directory /workspace/public-candidate
              npm install --global --force pnpm@10.18.3 yarn@1.22.22
              node scripts/verify-split-proof-input.mjs /runner-temp/release-authority-input
              node scripts/prove-split-release-consumer.mjs \
                --input /runner-temp/release-authority-input \
                --public-candidate public-candidate \
                --package-target "${{ matrix.target }}" \
                --phase "${{ matrix.phase }}" \
                --node-major "${{ matrix.nodeMajor }}" \
                --package-manager "${{ matrix.packageManager }}" \
                --mode "${{ matrix.mode }}" \
                --output "/runner-temp/consumer-${{ matrix.laneId }}"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-${{ matrix.laneId }}
          path: ${{ runner.temp }}/consumer-${{ matrix.laneId }}
          if-no-files-found: error
          retention-days: 7

  node26-health:
    if: github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'bootstrap'
    name: Node26 forward-compatibility health
    needs: stage-sealed-input
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: public-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          name: release-authority-input-0.1.37
          path: ${{ runner.temp }}/release-authority-input
      - name: Resolve exact Node26 patch and run same-artifact npm build/dev health
        shell: bash
        run: |
          set -euo pipefail
          node -e "if(process.versions.node.split('.')[0]!=='26')process.exit(1);console.log(process.versions.node)"
          for mode in build dev; do
            node scripts/prove-split-release-consumer.mjs \
              --input "${{ runner.temp }}/release-authority-input" \
              --public-candidate public-candidate \
              --package-target linux-x64-gnu \
              --phase HEALTH \
              --node-major 26 \
              --package-manager npm \
              --mode "$mode" \
              --health \
              --output "${{ runner.temp }}/node26-$mode"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node26-health-0.1.37
          path: ${{ runner.temp }}/node26-*
          if-no-files-found: warn
          retention-days: 7

  aggregate-bootstrap:
    if: github.event_name == 'workflow_dispatch' && inputs.proof_mode == 'bootstrap'
    name: aggregate classifier-selected release authority
    needs:
      - stage-sealed-input
      - consumer-matrix
      - public-consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-authority-input-0.1.37
          path: release-authority-input
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-P*
          path: consumer-proofs
      - name: Aggregate exactly the classifier-selected receipts
        run: >-
          node scripts/aggregate-split-release-proofs.mjs
          --input release-authority-input
          --consumers consumer-proofs
          --output release-candidate
          --public-proof-tooling-sha ${{ github.sha }}
          --publication-tooling-sha 5ea6277f4e176861fb12e66ff0cbfd71bca234c6
      - name: Prove permanent failure-closed injections
        run: >-
          node scripts/inject-split-proof-failures.mjs
          --input release-authority-input
          --consumers consumer-proofs
          --output release-candidate/failure-injection-proof.json
          --public-proof-tooling-sha ${{ github.sha }}
          --publication-tooling-sha 5ea6277f4e176861fb12e66ff0cbfd71bca234c6
      - uses: actions/upload-artifact@v4
        with:
          name: ionify-release-authority-0.1.37
          path: release-candidate
          if-no-files-found: error
          retention-days: 7
